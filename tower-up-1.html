<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tower Up</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--ac:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head><body><div id="w"><canvas id="c" width="360" height="640"></canvas><div id="ov"></div></div>
<script>
const cv=document.getElementById("c"),g=cv.getContext("2d"),ov=document.getElementById("ov");
const W=360,H=640,BH=28,baseY=H-50;
const B=[
{n:"Minorai Kalon (Buxoro)",c:"#c8a169",d:"#8d6b3c",s:"a",r:"lan",rc:"#b98a52",t:.28},
{n:"Registon (Samarqand)",c:"#e0c27e",d:"#a8864a",s:"a",r:"dome",rc:"#14b8c6",t:0},
{n:"Toshkent teleminorasi",c:"#d4d7dc",d:"#8b929c",s:"g",r:"spire",rc:"#ef4444",t:.3},
{n:"Big Ben (London)",c:"#c8a35a",d:"#8c6b2c",s:"s",r:"pyr",rc:"#3f4f4a",t:.12},
{n:"Toj-Mahal (Hindiston)",c:"#f5f1e8",d:"#c9c2b0",s:"m",r:"onion",rc:"#f8f4ea",t:0},
{n:"Empire State (Nyu-York)",c:"#b9bcc0",d:"#7c8086",s:"s",r:"set",rc:"#9aa0a6",t:.38},
{n:"Petronas (Malayziya)",c:"#c7ccd1",d:"#7d8791",s:"g",r:"spire",rc:"#e5e7eb",t:.35},
{n:"Taipei 101 (Tayvan)",c:"#3aa57a",d:"#1f6f4f",s:"g",r:"pag",rc:"#2f8f66",t:.2},
{n:"Sankt-Vasiliy sobori (Moskva)",c:"#b4372c",d:"#7a1f18",s:"a",r:"onion",rc:"#16a34a",t:.05},
{n:"Burj Xalifa (Dubay)",c:"#8fb3d9",d:"#4a6f9c",s:"g",r:"spire",rc:"#cbd5e1",t:.5}];
const ST=[[125,211,252],[56,189,248],[30,64,175],[11,16,48],[2,3,10]],SB=[[224,242,254],[186,230,253],[76,110,200],[30,40,90],[8,10,30]];
function mix(S,a){const x=a*(S.length-1),i=Math.min(S.length-2,Math.floor(x)),f=x-i;return "rgb("+S[i].map((v,k)=>Math.round(v+(S[i+1][k]-v)*f)).join()+")"}
let mode="lv",L=0,lives=3,total=0,state="menu",blocks=[],drop=null,t=0,clk=0,t0=0,accs=[],cam=0,msg="",msgT=0,cool=0,fallT=0,last=performance.now();
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.4,p:Math.random()*6}));
const clouds=Array.from({length:7},()=>({x:Math.random()*W,y:Math.random()*H,s:.7+Math.random()*.9,v:6+Math.random()*10}));
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand()}catch(e){}}
const me=(()=>{try{const u=tg.initDataUnsafe.user;return u.username?"@"+u.username:(u.first_name||"O’yinchi")}catch(e){return"O’yinchi"}})();
const inf=()=>mode==="inf",dif=()=>inf()?Math.min(9,Math.max(0,blocks.length-1)/6):L;
const need=()=>inf()?1e9:5+L*2,bw=()=>96-L*3,sp=()=>.8+dif()*.22;
const wAt=i=>inf()?Math.max(46,96-i*.9):bw()*(1-B[L].t*i/need()),nw=()=>wAt(blocks.length);
const kOf=i=>inf()?Math.floor(i/10)%10:L;
const hx=()=>W/2+Math.sin(t*sp())*(80+dif()*4);
const hy=()=>Math.max(42,baseY-blocks.length*BH+cam-(70+dif()*26));
const alt=()=>{if(inf())return Math.min(1,(blocks.length-1)/45);const p=(state=="play"||state=="win"||state=="fall")?Math.min(1,(blocks.length-1)/need()):0;return Math.min(1,(L+p)/10)};
function getTop(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function save(k,n,sc,h){try{let a=getTop(k),o=a.find(r=>r.n===n);if(o&&o.s>=sc)return;a=a.filter(r=>r.n!==n);a.push({n,s:sc,h});a.sort((x,y)=>y.s-x.s);localStorage.setItem(k,JSON.stringify(a.slice(0,10)))}catch(e){}}
function tbl(k,u){const a=getTop(k).slice(0,5);return a.length?a.map((r,i)=>`<div class="r"><span>${i+1}. ${r.n}</span><span>${r.s}${u&&r.h?" ("+r.h+" qavat)":""}</span></div>`).join(""):"<p style='opacity:.6'>Hozircha bo’sh</p>"}
function menu(){state="menu";ov.style.display="flex";ov.innerHTML=`<h1>Tower Up</h1><p>Eng baland binoni quring!</p><button onclick="newGame('lv')">🏗 Bosqichli o’yin</button><button onclick="newGame('inf')">🚀 Cheksiz o’yin</button><button onclick="rank()" style="background:#334155;color:#f8fafc">🏆 Reyting</button><p style="opacity:.6;font-size:13px">${me}</p>`}
function rank(){ov.innerHTML=`<h1>🏆 Reyting</h1><p><b>Bosqichli</b></p>${tbl("tu")}<p><b>Cheksiz</b></p>${tbl("tue",1)}<button onclick="menu()">Orqaga</button>`}
function newGame(m){mode=m;L=0;lives=3;total=0;m==="lv"?intro():startLevel()}
function intro(){state="intro";ov.style.display="flex";ov.innerHTML=`<h1>${L+1}-bosqich</h1><p>${B[L].n}</p><p>Bo’laklar: ${need()} · Jon: ${"❤️".repeat(lives)}</p><button onclick="startLevel()">Boshlash</button>`}
function startLevel(){blocks=[{x:W/2,fy:0,vx:0,vy:0,r:0,vr:0,k:kOf(0)}];accs=[];drop=null;cam=0;t=0;t0=performance.now();cool=.4;state="play";ov.style.display="none"}
let AC=null,mg,dl,pf,muted=false,ci=0;
const CH=[[130.81,196,246.94,329.63],[110,164.81,196,261.63],[87.31,130.81,174.61,220],[98,146.83,196,246.94]];
function tone(f,t,d,v,dest){const o=AC.createOscillator(),q=AC.createGain();o.frequency.value=f;q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(v,t+d*.35);q.gain.linearRampToValueAtTime(0,t+d);o.connect(q);q.connect(dest);o.start(t);o.stop(t+d+.1)}
function ping(f,t,v){const o=AC.createOscillator(),q=AC.createGain();o.frequency.value=f;q.gain.setValueAtTime(0,t);q.gain.linearRampToValueAtTime(v,t+.02);q.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(q);q.connect(mg);q.connect(dl);o.start(t);o.stop(t+2.3)}
function pad(){if(!AC||AC.state!=="running")return;const t=AC.currentTime+.05;CH[ci++%4].forEach(f=>tone(f,t,12,.035,pf))}
function wind(){const n=AC.sampleRate*6,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=350;const q=AC.createGain();q.gain.value=.05;const o=AC.createOscillator();o.frequency.value=.08;const lg=AC.createGain();lg.gain.value=.025;o.connect(lg);lg.connect(q.gain);s.connect(f);f.connect(q);q.connect(mg);s.start();o.start()}
function initAudio(){if(AC){if(AC.state==="suspended")AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=muted?0:.6;mg.connect(AC.destination);dl=AC.createDelay(1);dl.delayTime.value=.5;const fb=AC.createGain();fb.gain.value=.4;dl.connect(fb);fb.connect(dl);dl.connect(mg);pf=AC.createBiquadFilter();pf.type="lowpass";pf.frequency.value=600;pf.connect(mg);pf.connect(dl);pad();setInterval(pad,8000);wind();try{speechSynthesis.getVoices()}catch(e){}}catch(e){AC=null}}
function setMute(){muted=!muted;if(mg)mg.gain.value=muted?0:.6;if(muted)try{speechSynthesis.cancel()}catch(e){}}
const VF={"Great!":"great.mp3","Very good!":"verygood.mp3","Excellent!":"excellent.mp3"};
function speak(w){try{const u=new SpeechSynthesisUtterance(w.replace("!","")),v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang)).find(x=>/female|woman|samantha|zira|aria|jenny|susan|karen|moira|tessa|google us english/i.test(x.name));if(v)u.voice=v;u.lang=v?v.lang:"en-US";u.rate=.8;u.pitch=1.25;u.volume=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function sfx(w){if(muted)return;try{const a=new Audio(VF[w]);a.volume=.8;a.play().catch(()=>speak(w))}catch(e){speak(w)}}
["click","touchend","pointerup"].forEach(e=>addEventListener(e,initAudio));
document.addEventListener("visibilitychange",()=>{if(AC)document.hidden?AC.suspend():AC.resume()});
function tap(e){e.preventDefault();initAudio();const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;if(px<48&&py<48){setMute();return}if(state==="play"&&!drop&&cool<=0)drop={x:hx(),y:hy(),vy:0,miss:false}}
cv.addEventListener("pointerdown",tap);
addEventListener("keydown",e=>{if(e.code==="Space")tap(e)});
const fw=[],wd=[];
let ps=1;
function praise(a,x){const i=blocks.length-1,k=a>=.95?["Excellent!",60]:a>=.85?["Very good!",40]:a>=.7?["Great!",24]:null;if(!k)return;ps=-ps;const bx=Math.min(W-55,Math.max(55,x+ps*(wAt(i)/2+85))),y=Math.max(110,baseY-i*BH+cam-10),h=Math.random()*360;wd.push({s:k[0],x:bx,y:y-45,l:1.3});for(let j=0;j<k[1];j++){const an=Math.random()*6.283,v=60+Math.random()*130;fw.push({x:bx,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,l:1.1+Math.random()*.4,c:(h+Math.random()*60)%360})}sfx(k[0],a)}
function collapse(){state="fall";fallT=1.6;blocks.forEach(b=>{b.vx=(Math.random()-.5)*160;b.vy=-Math.random()*200;b.vr=(Math.random()-.5)*4})}
function land(d,topB){const r=Math.abs(d)/nw();let x=drop.x,acc;
if(r<.07){x=topB.x;acc=1;msg="Mukammal! ✨"}else{acc=1-r;const p=Math.min(.95,r*r*1.8*(1+dif()*.1));msg="Xavf: "+Math.round(p*100)+"%";if(Math.random()<p){drop=null;msg="Qulab tushdi!";msgT=1.5;collapse();return}}
msgT=1;blocks.push({x,fy:0,vx:0,vy:0,r:0,vr:0,k:kOf(blocks.length)});accs.push(acc);drop=null;cool=.25;praise(acc,x);
if(!inf()&&blocks.length-1>=need())win()}
function win(){state="win";const sec=(performance.now()-t0)/1000,la=accs.reduce((a,b)=>a+b,0)/accs.length;
const pts=Math.round((la*1000+Math.max(0,100-sec)*4)*(1+L*.2));total+=pts;
setTimeout(()=>{ov.style.display="flex";const s=`<p>Aniqlik: <b>${Math.round(la*100)}%</b> · Vaqt: <b>${sec.toFixed(1)} s</b></p><p>Ball: +${pts} (jami ${total})</p>`;
if(L>=9){save("tu",me,total);ov.innerHTML=`<h1>🏆 G’alaba!</h1>${s}<p>Reytingga yozildi: ${me}</p><button onclick="menu()">Menyu</button>`}
else ov.innerHTML=`<h1>${B[L].n} qurildi!</h1>${s}<button onclick="L++;intro()">Keyingi bosqich</button>`},1400)}
function lose(){state="over";ov.style.display="flex";if(inf()){const n=blocks.length-1,av=accs.length?accs.reduce((a,b)=>a+b,0)/accs.length:0,sc=Math.round(n*100*av);save("tue",me,sc,n);ov.innerHTML=`<h1>Qulading!</h1><p>Balandlik: <b>${n} qavat</b></p><p>Ball: ${sc}</p><button onclick="newGame('inf')">Qayta o’ynash</button><button onclick="menu()">Menyu</button>`}else{if(total>0)save("tu",me,total);ov.innerHTML=`<h1>O’yin tugadi</h1><p>${L+1}-bosqichda to’xtadingiz</p><p>Ball: ${total}</p><button onclick="menu()">Menyu</button>`}}
const met=[];
function upd(dt){t+=dt;clk+=dt;cool-=dt;msgT-=dt;
if(alt()>.45&&Math.random()<dt*.7)met.push({x:Math.random()*W+60,y:-10,vx:-(120+Math.random()*120),vy:160+Math.random()*120,l:1.2});met.forEach(m=>{m.x+=m.vx*dt;m.y+=m.vy*dt;m.l-=dt});for(let i=met.length;i--;)if(met[i].l<=0)met.splice(i,1);
fw.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.l-=dt});wd.forEach(o=>{o.l-=dt;o.y-=15*dt});for(let i=fw.length;i--;)if(fw[i].l<=0)fw.splice(i,1);for(let i=wd.length;i--;)if(wd[i].l<=0)wd.splice(i,1);
if(state==="fall"){fallT-=dt;blocks.forEach(b=>{b.vy+=1500*dt;b.fy+=b.vy*dt;b.x+=b.vx*dt;b.r+=b.vr*dt});if(fallT<=0){state="wait";if(inf())lose();else{lives--;lives<=0?lose():intro()}}return}
if(state!=="play")return;
const tg=Math.max(0,blocks.length*BH-320);cam+=(tg-cam)*Math.min(1,5*dt);
if(drop){drop.vy+=1800*dt;drop.y+=drop.vy*dt;const ty=baseY-blocks.length*BH+cam;
if(!drop.miss&&drop.y>=ty){const tb=blocks[blocks.length-1],d=drop.x-tb.x;
if(Math.abs(d)>=nw()*.95){drop.miss=true;lives--;msg="Xato! ❌";msgT=1;if(lives<=0){state="wait";lose()}}else land(d,tb)}
else if(drop&&drop.y>H+60)drop=null}}
function blk(x,y,w,b,r){if(typeof b==="number")b=B[b];g.save();g.translate(x,y+BH/2);g.rotate(r||0);
const gr=g.createLinearGradient(-w/2,0,w/2,0);gr.addColorStop(0,b.c);gr.addColorStop(1,b.d);g.fillStyle=gr;g.fillRect(-w/2,-BH/2,w,BH);
const s=b.s;
if(s=="a"||s=="m"){g.fillStyle=s=="m"?"#94a3b8bb":"#0007";for(let i=-w/2+8;i<w/2-12;i+=16){g.beginPath();g.moveTo(i,8);g.lineTo(i,-2);g.arc(i+4,-2,4,Math.PI,0);g.lineTo(i+8,8);g.fill()}}
else if(s=="g"){g.fillStyle="#e0f2fe55";for(let i=-w/2+4;i<w/2-4;i+=8)g.fillRect(i,-BH/2+2,4,BH-4);g.fillStyle="#fff5";g.fillRect(-w/2,0,w,1)}
else{g.fillStyle="#0007";for(let i=-w/2+8;i<w/2-10;i+=14){g.fillRect(i,-9,6,7);g.fillRect(i,3,6,7)}}
g.strokeStyle="#0006";g.strokeRect(-w/2,-BH/2,w,BH);g.restore()}
function roof(x,y,w,b){const k=b.r;g.fillStyle=b.rc;g.beginPath();
if(k=="dome"){g.ellipse(x,y,w*.45,w*.5,0,Math.PI,0);g.fill();g.fillRect(x-1.5,y-w*.5-14,3,14)}
else if(k=="onion"){const h=w*.7;g.moveTo(x-w*.4,y);g.bezierCurveTo(x-w*.62,y-h*.35,x-w*.2,y-h*.6,x,y-h);g.bezierCurveTo(x+w*.2,y-h*.6,x+w*.62,y-h*.35,x+w*.4,y);g.fill();g.fillStyle="#fbbf24";g.fillRect(x-1.5,y-h-14,3,14)}
else if(k=="spire"){g.moveTo(x-w*.22,y);g.lineTo(x,y-90);g.lineTo(x+w*.22,y);g.fill()}
else if(k=="pyr"){g.moveTo(x-w*.45,y);g.lineTo(x,y-55);g.lineTo(x+w*.45,y);g.fill();g.fillStyle="#fbbf24";g.fillRect(x-1.5,y-72,3,17)}
else if(k=="lan"){g.fillRect(x-w*.3,y-26,w*.6,26);g.beginPath();g.ellipse(x,y-26,w*.3,w*.28,0,Math.PI,0);g.fill()}
else if(k=="set"){g.fillRect(x-w*.32,y-24,w*.64,24);g.fillRect(x-w*.2,y-44,w*.4,20);g.fillRect(x-w*.1,y-60,w*.2,16);g.fillRect(x-1.5,y-95,3,35)}
else{for(let j=0;j<3;j++){const ww=w*(.5-j*.12);g.fillRect(x-ww/2,y-(j+1)*20,ww,18)}g.fillRect(x-1.5,y-95,3,35)}}
function planet(k,y){const x=40+(k*137)%280,r=20+(k*53)%26,ty=k%6,C=[["#e5e7eb","#9ca3af"],["#e8c97a","#b8924a"],["#d9552f","#8e2f17"],["#60a5fa","#1d4ed8"],["#e0a96d","#a8683a"],["#a78bfa","#6d28d9"]][ty];g.save();g.translate(x,y);
if(ty==1){g.strokeStyle="#e8c97acc";g.lineWidth=5;g.beginPath();g.ellipse(0,0,r*1.7,r*.45,-.35,Math.PI,6.283);g.stroke()}
const gr=g.createRadialGradient(-r*.35,-r*.35,r*.2,0,0,r);gr.addColorStop(0,C[0]);gr.addColorStop(1,C[1]);g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,6.283);g.fill();
g.save();g.clip();if(ty==4||ty==5){g.fillStyle="#0003";for(let j=-1;j<=1;j++)g.fillRect(-r,j*r*.45-3,r*2,6)}if(ty==0||ty==2){g.fillStyle="#0003";[[-.3,-.2,.18],[.3,.25,.14],[.1,-.5,.1]].forEach(q=>{g.beginPath();g.arc(q[0]*r,q[1]*r,q[2]*r,0,6.283);g.fill()})}if(ty==3){g.fillStyle="#22c55e99";g.beginPath();g.arc(-r*.25,0,r*.35,0,6.283);g.fill()}g.restore();
if(ty==1){g.strokeStyle="#e8c97acc";g.lineWidth=5;g.beginPath();g.ellipse(0,0,r*1.7,r*.45,-.35,0,Math.PI);g.stroke()}
g.restore()}
function T(s,x,y,a){g.textAlign=a;g.lineWidth=3;g.strokeStyle="#000a";g.strokeText(s,x,y);g.fillText(s,x,y);g.lineWidth=1}
function draw(){const a=alt(),b=B[inf()?kOf(Math.max(0,blocks.length-1)):L];
const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,mix(ST,a));gr.addColorStop(1,mix(SB,a));g.fillStyle=gr;g.fillRect(0,0,W,H);
const sa=Math.max(0,(a-.45)*1.9);
if(sa>0){g.fillStyle="#fff";stars.forEach(s=>{g.globalAlpha=sa*(.6+.4*Math.sin(clk*2+s.p));g.fillRect(s.x,(s.y+cam*.05)%H,s.s,s.s)})}
met.forEach(m=>{g.globalAlpha=Math.max(0,Math.min(1,m.l));g.strokeStyle="#fff";g.lineWidth=2;g.beginPath();g.moveTo(m.x,m.y);g.lineTo(m.x-m.vx*.12,m.y-m.vy*.12);g.stroke()});g.lineWidth=1;
if(inf()){for(let k=Math.max(0,Math.floor((cam-3200)/900));k<=Math.floor((cam-400)/900)+2;k++){const y=200+(cam-(1400+k*900))*.3;if(y>-90&&y<H+90){g.globalAlpha=Math.min(1,a*1.5);planet(k,y)}}}
else if(a>.7){g.globalAlpha=Math.min(1,(a-.7)*4);g.fillStyle="#e5e7eb";g.beginPath();g.arc(290,130,26,0,6.283);g.fill();g.fillStyle="#cbd5e1";[[282,124,6],[298,138,5],[284,140,4]].forEach(q=>{g.beginPath();g.arc(q[0],q[1],q[2],0,6.283);g.fill()})}
const ca=Math.max(0,1-a*1.9);
if(ca>0){g.globalAlpha=ca*.9;g.fillStyle="#fff";clouds.forEach(c=>{const cx=(c.x+clk*c.v)%(W+120)-60,cy=((c.y+cam*.3)%(H+80))-40,s=c.s;[[0,0,22],[20,6,18],[-20,6,16],[8,-8,16]].forEach(q=>{g.beginPath();g.arc(cx+q[0]*s,cy+q[1]*s,q[2]*s,0,6.283);g.fill()})})}
g.globalAlpha=1;
g.fillStyle="#3f9b4a";g.fillRect(0,baseY+BH+cam,W,H);g.fillStyle="#2f7d3a";g.fillRect(0,baseY+BH+cam,W,5);
fw.forEach(p=>{g.globalAlpha=Math.max(0,Math.min(1,p.l));g.fillStyle="hsl("+p.c+",100%,60%)";g.beginPath();g.arc(p.x,p.y,2.5,0,6.283);g.fill()});g.globalAlpha=1;
blocks.forEach((k,i)=>blk(k.x,baseY-i*BH+cam+k.fy,wAt(i),B[k.k],k.r));
