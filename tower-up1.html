const CH=[[130.81,196,246.94,329.63],[110,164.81,196,261.63],[87.31,130.81,174.61,220],[98,146.83,196,246.94]];

["click","touchend","pointerup"].forEach(e=>addEventListener(e,initAudio));

msgT=1;blocks.push({x,fy:0,vx:0,vy:0,r:0,vr:0,k:kOf(blocks.length)});accs.push(acc);drop=null;cool=.25;praise(acc,x);
if(!inf()&&blocks.length-1>=need())win()}
function win(){state="win";const sec=(performance.now()-t0)/1000,la=accs.reduce((a,b)=>a+b,0)/accs.length;
const pts=Math.round((la*1000+Math.max(0,100-sec)*4)*(1+L*.2));total+=pts;

if(L>=LV-1){save("tu",ME,total);ov.innerHTML=`<h1>🏆 G’alaba!</h1>${s}<p>Reytingga yozildi: ${ME}</p><button onclick="menu()">Menyu</button>`}
else ov.innerHTML=`<h1>${B[L].n} qurildi!</h1>${s}<button onclick="L++;intro()">Keyingi bosqich</button>`},1400)}

const met=[];
function upd(dt){t+=dt;clk+=dt;cool-=dt;msgT-=dt;updFO(dt);updW(dt);
if(alt()>.45&&Math.random()<dt*.7)met.push({x:Math.random()*W+60,y:-10,vx:-(120+Math.random()*120),vy:160+Math.random()*120,l:1.2});met.forEach(m=>{m.x+=m.vx*dt;m.y+=m.vy*dt;m.l-=dt});for(let i=met.length;i--;)if(met[i].l<=0)met.splice(i,1);
fw.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.l-=dt});wd.forEach(o=>{o.l-=dt;o.y-=15*dt});for(let i=fw.length;i--;)if(fw[i].l<=0)fw.splice(i,1);for(let i=wd.length;i--;)if(wd[i].l<=0)wd.splice(i,1);
if(state==="fall"){fallT-=dt;blocks.forEach(b=>{b.vy+=1500*dt;b.fy+=b.vy*dt;b.x+=b.vx*dt;b.r+=b.vr*dt});if(fallT<=0){state="wait";if(inf())lose();else{lives--;lives<=0?lose():intro()}}return}

if(Math.abs(d)>=nw()*.95){drop.miss=true;lives--;msg="Xato! ❌";msgT=1;if(lives<=0){state="wait";lose()}}else land(d,tb)}
else if(drop&&drop.y>H+60)drop=null}}
function sh(c,k){const n=parseInt(c.slice(1),16),f=k<0?0:255,a=Math.abs(k);return"rgb("+[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(f-v)*a)).join()+")"}
function chk(w,c1,c2){const q=7;for(let ix=0;ix*q<w+q;ix++)for(let iy=0;iy<4;iy++){g.fillStyle=(ix+iy)%2?c2:c1;g.fillRect(-w/2+ix*q,-14+iy*q,q,q)}}

const PAT={
kalta(w,i){if(i===0){g.fillStyle="#b9a68a";g.fillRect(-w/2,-14,w,28);g.fillStyle="#0002";for(let k=0;k<9;k++)g.fillRect(-w/2+(k*37)%w,-11+(k*11)%20,6,3);return}
const m=(i-1)%6;if(m===1)chk(w,"#ece6d2","#3f93bd");else if(m===3){chk(w,"#e9e1c9","#2e8b6a");g.fillStyle="#d9822b";for(let x=-w/2+7;x<w/2;x+=14)g.fillRect(x,-7,4,4)}else if(m===5)chk(w,"#e8eef0","#5aa6c9");else if(m===2){g.fillStyle="#c9935f";g.fillRect(-w/2,-14,w,5);g.fillStyle="#fff8";g.fillRect(-w/2,-9,w,1)}else if(m===4){g.fillStyle="#1d5f86";g.fillRect(-w/2,-3,w,2);g.fillRect(-w/2,5,w,2)}else{g.fillStyle="#a8d6ea";g.fillRect(-w/2,-14,w,2)}},
kalon(w,i,n){if(i===0){g.fillStyle="#b58f56";g.fillRect(-w/2,-14,w,28);return}const m=i%4;g.strokeStyle="#8a6637";g.lineWidth=1.4;
if(m===0){zig(w,"#8a6637",-5,5);zig(w,"#8a6637",6,5)}else if(m===1){for(const y of[-6,2,10]){g.beginPath();g.moveTo(-w/2,y);g.lineTo(w/2,y);g.stroke()}for(let x=-w/2,k=0;x<w/2;x+=8,k++){g.beginPath();g.moveTo(x,-6+(k%2)*8);g.lineTo(x,2+(k%2)*8);g.stroke()}}else if(m===2){for(let x=-w/2+5;x<w/2;x+=10){g.beginPath();g.moveTo(x,-9);g.lineTo(x+5,0);g.lineTo(x,9);g.lineTo(x-5,0);g.closePath();g.stroke()}}else{g.fillStyle="#e2cfa0";g.fillRect(-w/2,-14,w,6);zig(w,"#8a6637",5,4)}
if(i===n-2){g.fillStyle="#2b6cb0";g.fillRect(-w/2,-3,w,5);g.fillStyle="#fff9";for(let x=-w/2+3;x<w/2;x+=8)g.fillRect(x,-1,3,1.5)}},
tash(w){g.strokeStyle="#0003";g.lineWidth=1;for(let x=-w/2+9;x<w/2;x+=9){g.beginPath();g.moveTo(x,-14);g.lineTo(x,14);g.stroke()}g.fillStyle="#2f3b48";for(let x=-w/2+6;x<w/2-4;x+=18)g.fillRect(x,-3,7,5);g.fillStyle="#fff6";g.fillRect(-w/2,13,w,1)},
pisa(w,i){const cells=Math.max(2,Math.floor(w/12)),st=-w/2+(w-cells*12)/2+6;g.fillStyle=i===0?"#4a423655":"#4a4236cc";for(let k=0;k<cells;k++){const cx=st+k*12;g.beginPath();g.moveTo(cx-4,11);g.lineTo(cx-4,-3);g.arc(cx,-3,4,Math.PI,0);g.lineTo(cx+4,11);g.fill()}g.fillStyle="#fff";g.fillRect(-w/2,12,w,2);g.fillStyle="#d8d0bc";g.fillRect(-w/2,-14,w,2)},

const ROUND={kalta:1,kalon:1,tash:1,pisa:1};
