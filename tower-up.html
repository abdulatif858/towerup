<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tower Up</title>
<style>
:root{--bg:#0f172a;--fg:#f8fafc;--ac:#f59e0b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#w{position:relative;height:100%;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:9/16;touch-action:manipulation}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172ad9;text-align:center;padding:24px;gap:10px}
#ov h1{margin:0;font-size:34px;color:var(--ac)}#ov p{margin:2px 0;opacity:.9}
button,input{font:inherit;padding:12px 28px;border-radius:12px;border:0}
button{background:var(--ac);color:#000;font-weight:700}
input{background:#1e293b;color:var(--fg);text-align:center}
.r{display:flex;gap:16px;justify-content:space-between;min-width:200px}
</style></head><body><div id="w"><canvas id="c" width="360" height="640"></canvas><div id="ov"></div></div>
<script>
const cv=document.getElementById("c"),g=cv.getContext("2d"),ov=document.getElementById("ov");
const W=360,H=640,BH=28,baseY=H-50;
const B=[["Minorai Kalon (Buxoro)","#c2813b"],["Eyfel minorasi","#8b6f47"],["Toshkent teleminorasi","#94a3b8"],["Piza minorasi","#e5e7eb"],["Big Ben","#d6a85c"],["Empire State","#64748b"],["Petronas","#cbd5e1"],["Shanghai Tower","#38bdf8"],["Taipei 101","#34d399"],["Burj Xalifa","#60a5fa"]];
let L=0,lives=3,total=0,state="menu",blocks=[],drop=null,t=0,t0=0,accs=[],cam=0,msg="",msgT=0,cool=0,fallT=0,last=performance.now();
const need=()=>5+L*2,bw=()=>96-L*3,sp=()=>1.6+L*.45;
const hx=()=>W/2+Math.sin(t*sp())*105;
function save(n,s){try{let a=JSON.parse(localStorage.getItem("tu")||"[]");a.push({n,s});a.sort((x,y)=>y.s-x.s);a=a.slice(0,5);localStorage.setItem("tu",JSON.stringify(a));return a}catch(e){return[{n,s}]}}
function top(){try{return JSON.parse(localStorage.getItem("tu")||"[]")}catch(e){return[]}}
function lb(){const a=top();return a.length?"<p><b>Reyting</b></p>"+a.map((r,i)=>`<div class="r"><span>${i+1}. ${r.n}</span><span>${r.s}</span></div>`).join(""):""}
function menu(){state="menu";ov.style.display="flex";ov.innerHTML=`<h1>Tower Up</h1><p>Kran bo’lakni silkitadi — ekranni bosib, aniq joylashtiring.</p><p>10 bosqich · 3 jon · noto’g’ri qo’ysangiz bino qulashi mumkin</p>${lb()}<button onclick="newGame()">O’ynash</button>`}
function newGame(){L=0;lives=3;total=0;intro()}
function intro(){state="intro";ov.style.display="flex";ov.innerHTML=`<h1>${L+1}-bosqich</h1><p>${B[L][0]}</p><p>Bo’laklar: ${need()} · Jon: ${"❤️".repeat(lives)}</p><button onclick="startLevel()">Boshlash</button>`}
function startLevel(){blocks=[{x:W/2,fy:0,vx:0,vy:0,r:0,vr:0}];accs=[];drop=null;cam=0;t=0;t0=performance.now();cool=.4;state="play";ov.style.display="none"}
function tap(e){e.preventDefault();if(state==="play"&&!drop&&cool<=0)drop={x:hx(),y:70,vy:0,miss:false}}
cv.addEventListener("pointerdown",tap);
addEventListener("keydown",e=>{if(e.code==="Space")tap(e)});
function collapse(){state="fall";fallT=1.6;blocks.forEach(b=>{b.vx=(Math.random()-.5)*160;b.vy=-Math.random()*200;b.vr=(Math.random()-.5)*4})}
function land(d,topB){const r=Math.abs(d)/bw();let x=drop.x,acc;
if(r<.07){x=topB.x;acc=1;msg="Mukammal! ✨"}else{acc=1-r;const p=Math.min(.95,r*r*1.8*(1+L*.1));msg="Xavf: "+Math.round(p*100)+"%";if(Math.random()<p){drop=null;msg="Qulab tushdi!";msgT=1.5;collapse();return}}
msgT=1;blocks.push({x,fy:0,vx:0,vy:0,r:0,vr:0});accs.push(acc);drop=null;cool=.25;
if(blocks.length-1>=need())win()}
function win(){state="win";const sec=(performance.now()-t0)/1000,la=accs.reduce((a,b)=>a+b,0)/accs.length;
const pts=Math.round((la*1000+Math.max(0,100-sec)*4)*(1+L*.2));total+=pts;
setTimeout(()=>{ov.style.display="flex";const s=`<p>Aniqlik: <b>${Math.round(la*100)}%</b> · Vaqt: <b>${sec.toFixed(1)} s</b></p><p>Ball: +${pts} (jami ${total})</p>`;
if(L>=9){const n=localStorage.getItem("tun")||"";ov.innerHTML=`<h1>🏆 G’alaba!</h1>${s}<input id="nm" placeholder="Ismingiz" value="${n}" maxlength="14"><button onclick="fin()">Reytingga yozish</button>`}
else ov.innerHTML=`<h1>${B[L][0]} qurildi!</h1>${s}<button onclick="L++;intro()">Keyingi bosqich</button>`},900)}
function fin(){const n=(document.getElementById("nm").value||"O’yinchi").trim();try{localStorage.setItem("tun",n)}catch(e){}save(n,total);menu()}
function lose(){state="over";ov.style.display="flex";ov.innerHTML=`<h1>O’yin tugadi</h1><p>${L+1}-bosqichda to’xtadingiz</p><p>Ball: ${total}</p><button onclick="if(total>0)save('O’yinchi',total);menu()">Menyu</button>`}
function upd(dt){t+=dt;cool-=dt;msgT-=dt;
if(state==="fall"){fallT-=dt;blocks.forEach(b=>{b.vy+=1500*dt;b.fy+=b.vy*dt;b.x+=b.vx*dt;b.r+=b.vr*dt});if(fallT<=0){lives--;lives<=0?lose():intro();state="wait"}return}
if(state!=="play")return;
const tg=Math.max(0,blocks.length*BH-320);cam+=(tg-cam)*Math.min(1,5*dt);
if(drop){drop.vy+=1800*dt;drop.y+=drop.vy*dt;const ty=baseY-blocks.length*BH+cam;
if(!drop.miss&&drop.y+BH>=ty){const tb=blocks[blocks.length-1],d=drop.x-tb.x;
if(Math.abs(d)>=bw()*.95){drop.miss=true;lives--;msg="Xato! ❌";msgT=1;if(lives<=0){state="wait";lose()}}else land(d,tb)}
else if(drop&&drop.y>H+60)drop=null}}
function blk(x,y,w,c,r){g.save();g.translate(x,y+BH/2);g.rotate(r||0);g.fillStyle=c;g.fillRect(-w/2,-BH/2,w,BH);g.fillStyle="#fff3";for(let i=-w/2+8;i<w/2-8;i+=16)g.fillRect(i,-6,8,10);g.strokeStyle="#0006";g.strokeRect(-w/2,-BH/2,w,BH);g.restore()}
function draw(){g.fillStyle="#0f172a";g.fillRect(0,0,W,H);g.fillStyle="#1e293b";g.fillRect(0,baseY+BH-cam>H?H:baseY+BH-cam,W,H);
const c=B[L][1],w=bw();
blocks.forEach((b,i)=>blk(b.x,baseY-(i+1)*BH+cam+b.fy+BH,w,c,b.r));
if(state==="win"&&blocks.length>1){const tb=blocks[blocks.length-1],y=baseY-blocks.length*BH+cam+BH;g.fillStyle="#fbbf24";g.beginPath();g.moveTo(tb.x-w/2,y);g.lineTo(tb.x,y-60);g.lineTo(tb.x+w/2,y);g.fill()}
if(state==="play"){const x=hx();g.strokeStyle="#94a3b8";g.lineWidth=3;g.beginPath();g.moveTo(0,30);g.lineTo(W,30);g.stroke();g.lineWidth=1;
if(drop)blk(drop.x,drop.y-BH,w,c);else if(cool<=0){g.beginPath();g.moveTo(x,30);g.lineTo(x,42);g.stroke();blk(x,42,w,c)}}
g.fillStyle="#f8fafc";g.font="bold 15px system-ui";g.textAlign="left";g.fillText(`${L+1}/10 · ${B[L][0]}`,10,60+0);
g.textAlign="right";g.fillText("❤️".repeat(Math.max(0,lives)),W-10,22);
const pr=Math.min(1,(blocks.length-1)/need());g.fillStyle="#334155";g.fillRect(10,H-20,W-20,8);g.fillStyle="#f59e0b";g.fillRect(10,H-20,(W-20)*pr,8);
g.textAlign="left";g.fillText(Math.round(pr*100)+"%",10,H-26);
if(state==="play"){g.textAlign="right";g.fillText(((performance.now()-t0)/1000).toFixed(1)+" s",W-10,H-26)}
if(msgT>0){g.textAlign="center";g.font="bold 22px system-ui";g.fillStyle="#fbbf24";g.fillText(msg,W/2,H/2)}}
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
